<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Cam - Kho 50 Ảnh</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f13; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; }
        h1 { font-size: 1.15rem; margin-bottom: 12px; background: linear-gradient(45deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        /* Khung Camera */
        .cam-box { position: relative; width: 100%; max-width: 420px; aspect-ratio: 3/4; background: #1e1e26; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.08); }
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.25s; }
        .mirror { transform: scaleX(-1); }
        
        /* Các chế độ làm đẹp */
        .filter-normal { filter: none; }
        .filter-glow { filter: brightness(1.09) contrast(1.04) saturate(1.16) blur(0.25px); }
        .filter-peach { filter: brightness(1.08) contrast(1.05) sepia(0.15) saturate(1.25); }
        .filter-vintage { filter: sepia(0.28) contrast(1.12) brightness(1.04) saturate(1.18); }
        .filter-cool { filter: brightness(1.07) contrast(1.08) hue-rotate(-10deg) saturate(1.12); }

        /* Nút điều khiển trên Camera */
        .controls { position: absolute; bottom: 18px; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; padding: 0 18px; }
        .btn-sub { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.22); color: #fff; padding: 9px 14px; border-radius: 50px; font-size: 0.82rem; backdrop-filter: blur(8px); cursor: pointer; min-width: 86px; text-align: center; }
        .btn-sub:active { background: rgba(255,255,255,0.2); }
        .btn-snap { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,0.38); cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn-snap:active { transform: scale(0.88); }

        /* Thanh chọn Filter */
        .filters { display: flex; gap: 8px; margin: 14px 0; overflow-x: auto; max-width: 420px; width: 100%; padding-bottom: 4px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .f-chip { background: #1e1e26; border: 1px solid #333; color: #ccc; padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .f-chip.active { background: linear-gradient(45deg, #ff6b6b, #ff8e53); color: #fff; border-color: transparent; font-weight: bold; }

        /* Thư viện ảnh chung */
        .gallery-header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px; font-size: 0.9rem; color: #bbb; }
        .gallery-right { display: flex; align-items: center; gap: 10px; }
        .btn-refresh { background: #262630; border: 1px solid #3a3a48; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; cursor: pointer; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 420px; padding-bottom: 30px; }
        .photo-item { position: relative; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: #1e1e26; border: 1px solid rgba(255,255,255,0.06); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }
        .photo-time { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.65); font-size: 0.62rem; padding: 2px 5px; border-radius: 4px; color: #eee; }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: #666; padding: 30px 0; font-size: 0.9rem; }

        /* Xem ảnh phóng to */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 99; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        #modal img { max-width: 100%; max-height: 75vh; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); }
        .modal-btns { display: flex; gap: 12px; margin-top: 18px; }
        .btn-dl { padding: 10px 22px; border-radius: 22px; border: none; background: #2ed573; color: #000; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        .btn-close { padding: 10px 22px; border-radius: 22px; border: none; background: #ff4757; color: #fff; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    </style>
</head>
<body>

    <h1>✨ Cloud Cam (Kho chung 50 ảnh)</h1>

    <div class="cam-box">
        <video id="video" class="mirror filter-glow" autoplay playsinline></video>
        <div class="flash" id="flash"></div>
        <div class="controls">
            <button class="btn-sub" onclick="switchCam()">🔄 Đổi Cam</button>
            <button class="btn-snap" onclick="takePhoto()"></button>
            <div class="btn-sub" id="statusTxt">Sẵn sàng</div>
        </div>
    </div>

    <div class="filters">
        <div class="f-chip" onclick="setFilter('filter-normal', this)">Gốc</div>
        <div class="f-chip active" onclick="setFilter('filter-glow', this)">✨ Mịn & Sáng</div>
        <div class="f-chip" onclick="setFilter('filter-peach', this)">🍑 Hồng hào</div>
        <div class="f-chip" onclick="setFilter('filter-vintage', this)">🎞️ Retro</div>
        <div class="f-chip" onclick="setFilter('filter-cool', this)">❄️ Hàn Quốc</div>
    </div>

    <div class="gallery-header">
        <span>Ảnh mọi người đã chụp</span>
        <div class="gallery-right">
            <span id="countTxt">0 / 50</span>
            <button class="btn-refresh" onclick="loadGallery()">↻ Tải lại</button>
        </div>
    </div>
    <div class="gallery" id="gallery">
        <div class="empty-msg">Đang tải kho ảnh...</div>
    </div>

    <div id="modal" onclick="closeModal(event)">
        <img id="modalImg" src="">
        <div class="modal-btns">
            <a id="downloadBtn" class="btn-dl" href="#" download="cloud-cam.jpg">⬇️ Tải về máy</a>
            <button class="btn-close" onclick="document.getElementById('modal').style.display='none'">Đóng</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const DB_URL = "https://chup-6184c-default-rtdb.firebaseio.com";
        const MAX_PHOTOS = 50;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const gallery = document.getElementById('gallery');
        const statusTxt = document.getElementById('statusTxt');
        const countTxt = document.getElementById('countTxt');
        let currentStream = null;
        let useFrontCam = true;
        let currentFilter = 'filter-glow';
        let photoKeys = [];
        let isTaking = false;

        async function startCam() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: {
                    facingMode: useFrontCam ? "user" : "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 1706 }
                },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                video.classList.toggle('mirror', useFrontCam);
            } catch (err) {
                alert("Không mở được camera! Hãy mở bằng link GitHub Pages (HTTPS) và cho phép quyền Camera.");
            }
        }

        function switchCam() {
            useFrontCam = !useFrontCam;
            startCam();
        }

        function setFilter(filterClass, el) {
            video.classList.remove(currentFilter);
            currentFilter = filterClass;
            video.classList.add(currentFilter);
            document.querySelectorAll('.f-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        async function takePhoto() {
            if (isTaking || !video.videoWidth) return;
            isTaking = true;

            const flash = document.getElementById('flash');
            flash.style.opacity = 0.85;
            setTimeout(() => flash.style.opacity = 0, 150);

            statusTxt.innerText = "Đang lưu...";

            const scale = 600 / video.videoWidth;
            canvas.width = 600;
            canvas.height = video.videoHeight * scale;
            const ctx = canvas.getContext('2d');

            const computedFilter = getComputedStyle(video).filter;
            ctx.filter = computedFilter !== 'none' ? computedFilter : 'none';

            if (useFrontCam) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Img = canvas.toDataURL('image/jpeg', 0.78);

            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} ${now.getDate()}/${now.getMonth()+1}`;

            try {
                const res = await fetch(`${DB_URL}/photos.json`, {
                    method: 'POST',
                    body: JSON.stringify({ img: base64Img, time: timeStr, ts: Date.now() })
                });

                if (!res.ok) throw new Error("Firebase chặn quyền ghi");

                // Vượt quá 50 ảnh -> xóa ảnh cũ nhất
                if (photoKeys.length >= MAX_PHOTOS) {
                    const deleteCount = photoKeys.length - MAX_PHOTOS + 1;
                    for (let i = 0; i < deleteCount; i++) {
                        await fetch(`${DB_URL}/photos/${photoKeys[i]}.json`, { method: 'DELETE' });
                    }
                }

                statusTxt.innerText = "Đã lưu!";
                setTimeout(() => statusTxt.innerText = "Sẵn sàng", 1500);
                await loadGallery();
            } catch (e) {
                statusTxt.innerText = "Lỗi lưu!";
                alert("Lỗi lưu ảnh! Vào Firebase -> Realtime Database -> tab Rules sửa .read và .write thành true nhé.");
            } finally {
                isTaking = false;
            }
        }

        async function loadGallery() {
            try {
                const res = await fetch(`${DB_URL}/photos.json`);
                const data = await res.json();
                gallery.innerHTML = "";
                photoKeys = [];

                if (!data || data.error) {
                    countTxt.innerText = `0 / ${MAX_PHOTOS}`;
                    gallery.innerHTML = `<div class="empty-msg">Chưa có ảnh nào. Bấm nút tròn để chụp mở hàng!</div>`;
                    return;
                }

                const entries = Object.entries(data).sort((a, b) => a[1].ts - b[1].ts);
                photoKeys = entries.map(e => e[0]);
                countTxt.innerText = `${entries.length} / ${MAX_PHOTOS}`;

                entries.reverse().forEach(([key, item]) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    div.innerHTML = `<img src="${item.img}" loading="lazy"><span class="photo-time">${item.time}</span>`;
                    div.onclick = () => {
                        document.getElementById('modalImg').src = item.img;
                        document.getElementById('downloadBtn').href = item.img;
                        document.getElementById('downloadBtn').download = `cam-${item.ts}.jpg`;
                        document.getElementById('modal').style.display = 'flex';
                    };
                    gallery.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function closeModal(e) {
            if (e.target.id === 'modal') {
                document.getElementById('modal').style.display = 'none';
            }
        }

        startCam();
        loadGallery();
        setInterval(loadGallery, 10000);
    </script>
</body>
              </html>
